[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fremont-bridge-analysis"
version = "0.1.0"
description = "Time-series analysis and forecasting of bicycle and scooter traffic on Seattle's Fremont Bridge"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "altair>=5.4",
  "holidays>=0.60",
  "marimo[recommended]>=0.16",
  "numpy>=2.0",
  "pandas>=2.2",
  "polars>=1.9",
  "pyarrow>=18",
  "requests>=2.32",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
boosting = [
  "lightgbm>=4.5",
  "optuna>=4.0",
  "shap>=0.46",
  "xgboost>=2.1",
]
deep-learning = [
  "neuralforecast>=2.0",
  "torch>=2.5",
]
report = [
  "jinja2>=3.1",
  "vl-convert-python>=1.7",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
fremont = "fremont_bridge_analysis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fremont_bridge_analysis"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
exclude = [".venv", "data", "outputs", "tools"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

